baseURL = 'https://nsd-public.ceo-suo.com/'
languageCode = 'ko-KR'
title = '낙성대 퍼블릭 벨루 - 실시간 정보'

[params]
  isAdsEnabled = true
  adsTelegramId = "ggyuvely"

  description = '벨루가 속한 퍼블릭이라는 업종부터 짚어 보겠습니다. 손님이 자리를 옮겨 다니며 서빙을 받는 방식이 기본형인 퍼블릭이고, 하이퍼블릭은 여기서 방과 인력을 더 두툼하게 갖춘 위쪽 구성으로 나뉩니다. 벨루를 방문하기 전 이 둘의 차이를 알아 두면 원하는 자리를 고르는 데 도움이 되고, 인원이 크지 않은 소규모 모임이라면 이 기본형만으로도 충분한 경우가 많습니다. 두세 명이 부담 없이 들르기에도 무난한 구성입니다.'
  author = '두리'
  datePublished = "2026-08-18T07:25:00+09:00"
  dateModified = "2026-08-18T07:25:00+09:00"
  [params.store]
	tel = "010-8306-5747"
  location = "낙성대"
	locationEn = "NSD"
  name = "벨루"
	nameEn = "BELU"
	nameIs = "는"
	category = "퍼블릭"
	categoryEn = "Public"
	categoryIs = "는"
	address = "서울 관악구"
	googleMapSrc = "https://www.google.com/maps?q=서울+관악구&output=embed"

enableRobotsTXT = false
cleanDestinationDir = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[caches]
  [caches.images]
    dir = ':cacheDir/images'
