## 자주 묻는 질문 데이터. 문항 4개(위치·영업시간·연락 방법·가격대), 템플릿은 layouts/home.html에서 순회한다.

[[items]]
question = "벨루는 어느 지역에 있나요?"
answer = "벨루는 서울 관악구 봉천동, 낙성대 인근에 자리해 있습니다."

[[items]]
question = "벨루 운영 시간이 궁금합니다."
answer = "벨루는 저녁 6시에 열어 다음날 오후 3시까지 영업을 이어가며, 나머지 세 시간은 청소로 비워 둡니다. 공휴일에는 운영시간이 바뀔 수 있어 전화로 확인해 주시길 권합니다."

[[items]]
question = "벨루는 어떻게 연락하나요?"
answer = "벨루 이용 문의는 010-7456-5410 전화 상담으로 받고 있습니다."

[[items]]
question = "벨루 가격대가 어떻게 되나요?"
answer = "벨루는 1인 200,000원, 2인 300,000원, 3인 420,000원, 4인 560,000원의 기본 요금 구간을 두고 있어 소규모 모임도 부담 없이 이용할 수 있습니다."
