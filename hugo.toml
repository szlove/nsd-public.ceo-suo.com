baseURL = 'https://nsd-public.ceo-suo.com/'
languageCode = 'ko-KR'
title = '낙성대 퍼블릭 벨루: BELU'

[params]
  isAdsEnabled = true
  adsTelegramId = "ggyuvely"

  description = '낙성대 퍼블릭 벨루는 신림동 1432-73에 자리한 퍼블릭 공간으로, 봉천·낙성대에서 오는 단체 손님이 테이블 단위로 예약해 이용한다.'
  author = '두리'
  datePublished = "2026-08-18T07:25:00+09:00"
  dateModified = "2026-08-18T07:25:00+09:00"
  [params.store]
	tel = "010-8306-5747"
  location = "낙성대"
	locationEn = "NSD"
  name = "벨루"
	nameEn = "BELU"
	nameIs = "는"
	category = "퍼블릭"
	categoryEn = "Public"
	categoryIs = "는"
	address = "서울 관악구"
	googleMapSrc = "https://www.google.com/maps?q=서울+관악구&output=embed"

enableRobotsTXT = false
cleanDestinationDir = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[caches]
  [caches.images]
    dir = ':cacheDir/images'
